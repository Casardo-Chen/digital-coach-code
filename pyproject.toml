[project]
name = "digital-coach"
version = "0.1.0"
description = "Coaching research code: shared session data, dialogue-act annotation, CLAIR eval with input ablations, and a realtime human-AI coach."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "datasets>=2.18.0",
]

[project.optional-dependencies]
eval = [
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
    "nltk>=3.8.1",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",
    "torch>=2.2.0",
    "transformers>=4.40.0",
]
plots = [
    "matplotlib>=3.8.0",
    "pandas>=2.1.0",
]
prototype = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "vision-agents[deepgram,elevenlabs,gemini,getstream,openai]>=0.5.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
