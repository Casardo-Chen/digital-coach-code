[project]
name = "digital-coach"
version = "0.1.0"
description = "Coaching research code: Hugging Face session loader, dialogue-act and coaching-method annotation, CLAIR eval with input ablations, and a realtime human-AI coach."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "python-dotenv>=1.0.0",
    "openai>=1.40.0",
    "huggingface_hub>=0.23.0",
]

[project.optional-dependencies]
eval = [
    "moviepy>=1.0.3",
    "Pillow>=10.0.0",
]
prototype = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "httpx>=0.27.0",
    "vision-agents[deepgram,elevenlabs,gemini,getstream,openai]>=0.5.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
